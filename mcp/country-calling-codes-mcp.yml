tools:
- name: get_phone_capabilities
  description: Discover supported countries, per-operation review coverage, evidence, dataset versions
    and request limits before choosing a phone workflow.
- name: analyze_phone_number
  description: Analyze a number using versioned numbering metadata. National numbers need numberCountryCode;
    exit prefixes need originCountryCode. Reports uncertainty and rule evidence, never live subscriber
    status.
- name: get_dialing_instructions
  description: Prepare origin-specific dialing guidance for reviewed countries. Provide origin and destination
    separately; no phone number returns safe placeholder patterns. Network-dependent results remain conditional.
- name: normalize_phone_numbers
  description: Normalize up to 100 records with unique IDs. Invalid records produce individual errors.
    Optionally identify canonical duplicate candidates; no contacts are changed or stored.
- name: compare_phone_numbers
  description: Compare two numbers after analysis. Missing context produces indeterminate. Extensions
    must match unless extensionPolicy is explicitly ignore; equality does not establish ownership.
- name: resolve_phone_region
  description: Resolve a phone number to metadata-backed country candidates or non-geographic numbering.
    Results are numbering assignments, not current location or carrier.
- name: get_phone_input_rules
  description: Get reviewed display placeholders and trunk-prefix guidance. Examples are not validation
    masks. English fallback and unsupported editorial coverage are explicit.
- name: diagnose_dialing_problem
  description: Explain formatting issues and propose reviewed prefix repairs for confirmation. Uses the
    same analyzer. Cannot determine why a network rejected a call.
- name: find_calling_windows
  description: Find overlapping working hours using explicit IANA time zones and dates. Handles overnight
    shifts and DST; never infers location from phone numbers or contacts participants.
- name: lookup_country_calling_code
  description: Look up international country calling codes by free text, ISO code, dial code, or region.
    Optionally return reviewed, source-linked dialing examples. This tool does not verify live subscriber
    numbers.
- name: format_international_phone_number
  description: Normalize a phone number into a plausible international format using reviewed country-specific
    rules. Processing is ephemeral. This tool does not query carriers, HLR/HSS, MNP databases, or live
    subscribers.
resources:
- countrycalling://capabilities
- countrycalling://coverage
- countrycalling://countries/{code}/phone-input
notes: 'Anonymous initialize and tools/list both answer 200 over SSE with real schemas — the server is

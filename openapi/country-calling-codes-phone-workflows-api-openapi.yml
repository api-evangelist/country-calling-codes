  /api/calling-windows:
    post:
      operationId: find_calling_windows
      summary: Find calling windows
      description: Find overlapping working hours using explicit IANA time zones and dates. Handles overnight shifts and DST; never infers location from phone numbers or contacts participants.
      tags:
      - Phone workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                participants:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 64
                      timeZone:
                        type: string
                        maxLength: 80
                      workingHours:
                        type: array
                        items:
                          type: object
                          properties:
                            start:
                              type: string
                              pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
                            end:
                              type: string
                              pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
                          required:
                          - start
                          - end
                          additionalProperties: false

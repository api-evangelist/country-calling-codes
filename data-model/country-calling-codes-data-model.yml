    description: Lookup envelopes — meta + query/lookup echo + matched countries[].
  - name: PhoneFormatRequest / PhoneFormatResponse
    description: Ephemeral formatter input (phoneNumber + optional countryCode) and result with stated limitations.
  - name: StatusResponse
    description: Live service status — version, timestamp, dataset counts and canonical endpoint links.
  - name: ErrorResponse
    description: The error envelope (error.code/message/details[] + documentation URI).
